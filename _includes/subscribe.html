<section id="subscribe" class="ved noise">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="label on-dark" data-i18n="subscribe.label">Stay in touch</span>
      <h2 class="h-section" data-i18n="subscribe.title">Want to receive updates from the ministry?</h2>
      <p class="body-text" data-i18n="subscribe.intro">New trainings, photos from the field, and prayer requests — sent to your inbox whenever there is news from Cusco.</p>
    </div>
    <form class="form subscribe reveal" id="subscribeForm">
      <label for="s_email" data-i18n="support.form_email">Email</label>
      <div class="subscribe__row">
        <input id="s_email" name="EMAIL" type="email" autocomplete="email" required>
        <button type="submit" class="btn on-dark" data-i18n="subscribe.btn">Subscribe</button>
      </div>
      <input name="email_address_check" tabindex="-1" autocomplete="off" hidden>
      <input name="html_type" value="simple" hidden>
      <p class="subscribe__note" id="subscribeNote" role="status" data-i18n="subscribe.note">We only use your email to send ministry updates. Unsubscribe anytime.</p>
    </form>
  </div>
</section>
